
<!DOCTYPE html>
<html ng-app="myApp">
<head>
    <title>TechLearn Website</title>

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-route.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>TechLearn</h1>
    <p>Learn Technology, Build Your Future</p>
</header>

<nav>
    <a href="#!/">Home</a>
    <a href="#!/about">About</a>
    <a href="#!/courses">Courses</a>
    <a href="#!/contact">Contact</a>
</nav>

<div class="content" ng-view></div>

<footer>
    <p>TechLearn Website | Learn Something New Every Day</p>
</footer>

<!-- Home Page -->
<script type="text/ng-template" id="home.html">
    <h2>Welcome to TechLearn</h2>

    <p>
        TechLearn is an educational website that helps students
        learn programming and modern technologies.
    </p>

    <img src="https://placehold.co/500x220/173b75/ffffff?text=Learn+Technology"
         alt="Technology learning">

    <h3>Why Choose Us?</h3>
    <p>Learn programming, develop projects, and improve your skills.</p>
</script>

<!-- About Page -->
<script type="text/ng-template" id="about.html">
    <h2>About Us</h2>

    <p>
        TechLearn provides simple and useful learning resources
        for students and beginners.
    </p>

    <h3>Our Mission</h3>
    <p>
        Our mission is to make technology education easy and
        accessible to everyone.
    </p>

    <h3>Our Vision</h3>
    <p>To help students become skilled technology professionals.</p>
</script>

<!-- Courses Page -->
<script type="text/ng-template" id="courses.html">
    <h2>Our Courses</h2>

    <ul>
        <li>HTML and CSS</li>
        <li>JavaScript</li>
        <li>AngularJS</li>
        <li>Python Programming</li>
        <li>Web Development</li>
    </ul>

    <h3>Benefits</h3>
    <p>Beginner-friendly lessons and practical project learning.</p>
</script>

<!-- Contact Page -->
<script type="text/ng-template" id="contact.html">
    <h2>Contact Us</h2>

    <form ng-submit="sendMessage()">
        <label>Name:</label><br>
        <input type="text" ng-model="name"
               placeholder="Enter your name" required>
        <br>

        <label>Email:</label><br>
        <input type="email" ng-model="email"
               placeholder="Enter your email" required>
        <br>

        <label>Message:</label><br>
        <textarea ng-model="message"
                  placeholder="Enter your message"
                  required></textarea>
        <br>

        <button type="submit">Send Message</button>
    </form>

    <p style="color:green" ng-show="sent">
        Message submitted successfully!
    </p>
</script>

<script>
    var app = angular.module("myApp", ["ngRoute"]);

    app.config(function($routeProvider) {
        $routeProvider
        .when("/", {
            templateUrl: "home.html"
        })
        .when("/about", {
            templateUrl: "about.html"
        })
        .when("/courses", {
            templateUrl: "courses.html"
        })
        .when("/contact", {
            templateUrl: "contact.html",
            controller: "ContactController"
        })
        .otherwise({
            redirectTo: "/"
        });
    });

    app.controller("ContactController", function($scope) {
        $scope.sendMessage = function() {
            $scope.sent = true;
        };
    });
</script>

</body>
</html>
